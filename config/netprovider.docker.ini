; netprovider — container configuration template (NON-SECRET, dev/demo values).
;
; docker-compose.yml bind-mounts this over /var/www/html/config/netprovider.ini.
; Core::getProperty() throws on any missing key, so every key Core defines is
; present here. Edit values for your environment; do NOT put real secrets in a
; committed file — override with your own mounted ini for real deployments.

[Database]
Database Host     = "db"
Database Name     = "netprovider"
Database Username = "netprovider"
Database Password = "netprovider"

[Financial]
Blank charges advance count = "3"
Enable VAT Payer specifics  = "false"
Allow firm registration     = "true"

[SMTP]
SMTP Server                       = "localhost"
SMTP Port                         = "25"
SMTP Auth                         = "false"
SMTP Username                     = ""
SMTP Password                     = ""
SMTP From                         = "netprovider@example.com"
SMTP Supervisor EMail             = "admin@example.com"
SMTP Send EMail on critical error = "false"

[UI]
Title  = "NetProvider (Docker)"
Vendor = "NetProvider"
Locale = "en_US.UTF-8"

[SMS]
SMS Username = ""
SMS Password = ""

[Network Device]
Network Device Platform      = "LINUX"
Network Device Host          = "192.168.88.1"
Network Device Port          = "22"
Network Device Login         = "admin"
Network Device Password      = ""
Network Device WAN interface = "eth0"
Network Device Command sudo     = "sudo"
Network Device Command iptables = "iptables"
Network Device IP accounting    = "netprovider_acct"
Network Device IP filter        = "netprovider_filter"

[System]
Debug = "false"
